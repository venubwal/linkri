<svg viewBox="0 0 360 92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FREE SSK AI Labs">
<defs>
<linearGradient id="brand" x1="20" y1="0" x2="330" y2="0">
<stop offset="0" stop-color="#0878ff"/><stop offset=".28" stop-color="#12baff"/>
<stop offset=".52" stop-color="#168cff"/><stop offset=".70" stop-color="#ff9b18"/><stop offset="1" stop-color="#ff5708"/>
</linearGradient>
<linearGradient id="orange" x1="100" y1="0" x2="230" y2="0">
<stop stop-color="#ff8b13"/><stop offset=".55" stop-color="#ff6b08"/><stop offset="1" stop-color="#ffc126"/>
</linearGradient>
<linearGradient id="free" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#00eaff"/><stop offset=".42" stop-color="#20ff72"/><stop offset=".72" stop-color="#ffe600"/><stop offset="1" stop-color="#ff4d00"/>
</linearGradient>
<linearGradient id="shine">
<stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="clip"><rect x="78" y="3" width="277" height="57" rx="8"/></clipPath>
</defs>
<style>
.logo{animation:breathe 4s ease-in-out infinite;transform-origin:220px 38px}
.free{animation:pulse 1.8s ease-in-out infinite;transform-origin:38px 31px}
.spark{animation:spark 1.8s ease-in-out infinite}
.sweep{animation:sweep 4s linear infinite}
.orbit{stroke-dasharray:180 430;animation:orbit 4s linear infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.96}50%{transform:scale(1.015);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(.86);opacity:.8}50%{transform:scale(1.13);opacity:1}}
@keyframes spark{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.5)}}
@keyframes sweep{0%{transform:translateX(-330px) skewX(-18deg);opacity:0}15%{opacity:.95}50%{transform:translateX(330px) skewX(-18deg);opacity:.85}70%,100%{transform:translateX(700px) skewX(-18deg);opacity:0}}
@keyframes orbit{from{stroke-dashoffset:610}to{stroke-dashoffset:0}}
</style>

<!-- LEFT: bright animated FREE announcement -->
<g class="free">
<text x="38" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
font-size="27" font-weight="900" font-style="italic" letter-spacing="1"
fill="#39ff72" opacity=".55" filter="url(#glow)">FREE</text>
<text x="38" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
font-size="27" font-weight="900" font-style="italic" letter-spacing="1"
fill="url(#free)" stroke="#fff" stroke-width=".6" paint-order="stroke" filter="url(#glow)">FREE</text>
<circle class="spark" cx="12" cy="17" r="2.2" fill="#00f6ff" filter="url(#glow)"/>
<circle class="spark" cx="64" cy="49" r="1.8" fill="#fff000" filter="url(#glow)"/>
<path class="spark" d="M8 45L18 49" stroke="#20ff72" stroke-width="1.6" stroke-linecap="round"/>
<path class="spark" d="M60 15L69 11" stroke="#ffef00" stroke-width="1.6" stroke-linecap="round"/>
</g>

<!-- SSK AI LABS -->
<g class="logo">
<ellipse class="orbit" cx="217" cy="31" rx="119" ry="27" fill="none" stroke="url(#brand)"
stroke-width="1.3" opacity=".55" transform="rotate(-8 217 31)"/>

<!-- Connected SSK: K overlaps the second S, no gap -->
<text x="111" y="49" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="900"
font-style="italic" letter-spacing="-11" fill="url(#brand)" filter="url(#glow)">S</text>
<text x="150" y="49" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="900"
font-style="italic" letter-spacing="-11" fill="url(#brand)" filter="url(#glow)">S</text>
<text x="188" y="49" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="900"
font-style="italic" fill="url(#orange)" filter="url(#glow)">K</text>

<circle class="spark" cx="285" cy="14" r="2.2" fill="#ffb12b"/>
<circle class="spark" cx="293" cy="11" r="1.25" fill="#24baff"/>
<path class="spark" d="M285 14L293 11" stroke="url(#brand)" stroke-width="1"/>

<g clip-path="url(#clip)"><rect class="sweep" x="-45" y="2" width="34" height="58" fill="url(#shine)"/></g>

<text x="220" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
font-size="12" font-weight="800" letter-spacing="5" fill="url(#brand)">AI LABS</text>
<text x="220" y="84" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
font-size="6.5" font-weight="600" letter-spacing="1.5" fill="#d7e5f5">We Create AI Applications</text>
</g>
</svg>